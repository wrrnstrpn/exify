version: 2
updates:
  # npm packages: one grouped PR for minor/patch bumps, separate PRs for majors.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Electron majors change Chromium/Node; upgrade those deliberately.
      - dependency-name: electron
        update-types: [version-update:semver-major]
      # Node types must match the Node version bundled in Electron (Electron 45 = Node 24).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  # GitHub Actions used by CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
